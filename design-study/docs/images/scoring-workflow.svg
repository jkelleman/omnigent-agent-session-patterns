<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4E5B68"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FAFBFC"/>
<text x="32" y="40" font-size="20" font-weight="700" fill="#1C2733">Scoring workflow</text>
<text x="32" y="62" font-size="13" fill="#4E5B68">From a message to a score you can trust, and back to a better message</text>
<rect x="25.0" y="193.0" width="170" height="74" rx="12" fill="#fff" stroke="#D5DBE1" stroke-width="1.2"/>
<text x="110" y="226" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Messages</text>
<text x="110" y="245" font-size="12" fill="#4E5B68" text-anchor="middle">messages.jsonl</text>
<text x="110" y="260" font-size="12" fill="#4E5B68" text-anchor="middle">text, surface, context</text>
<rect x="235.0" y="193.0" width="170" height="74" rx="12" fill="#fff" stroke="#D5DBE1" stroke-width="1.2"/>
<text x="320" y="226" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Applicability</text>
<text x="320" y="245" font-size="12" fill="#4E5B68" text-anchor="middle">Which checks apply</text>
<text x="320" y="260" font-size="12" fill="#4E5B68" text-anchor="middle">on this surface</text>
<rect x="455.0" y="103.0" width="180" height="74" rx="12" fill="#fff" stroke="#1F7A72" stroke-width="2"/>
<text x="545" y="136" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">LLM judge</text>
<text x="545" y="155" font-size="12" fill="#4E5B68" text-anchor="middle">judge.py</text>
<text x="545" y="170" font-size="12" fill="#4E5B68" text-anchor="middle">reads in context</text>
<rect x="455.0" y="283.0" width="180" height="74" rx="12" fill="#fff" stroke="#D5DBE1" stroke-width="1.2"/>
<text x="545" y="316" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Keyword checker</text>
<text x="545" y="335" font-size="12" fill="#4E5B68" text-anchor="middle">lint.py</text>
<text x="545" y="350" font-size="12" fill="#4E5B68" text-anchor="middle">rules and patterns</text>
<rect x="685.0" y="193.0" width="170" height="74" rx="12" fill="#fff" stroke="#D5DBE1" stroke-width="1.2"/>
<text x="770" y="226" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Compare</text>
<text x="770" y="245" font-size="12" fill="#4E5B68" text-anchor="middle">Agreement per check</text>
<text x="770" y="260" font-size="12" fill="#4E5B68" text-anchor="middle">pass/fail flips</text>
<rect x="685.0" y="393.0" width="170" height="74" rx="12" fill="#fff" stroke="#A35F00" stroke-width="2"/>
<text x="770" y="426" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Human scores</text>
<text x="770" y="445" font-size="12" fill="#4E5B68" text-anchor="middle">Two reviewers</text>
<text x="770" y="460" font-size="12" fill="#4E5B68" text-anchor="middle">human_scores.csv</text>
<path d="M975 172 L1063 230 L975 288 L887 230z" fill="#fff" stroke="#1C2733" stroke-width="1.4"/>
<text x="975" y="224" font-size="13" font-weight="700" fill="#1C2733" text-anchor="middle">80%+ agreement</text>
<text x="975" y="241" font-size="13" font-weight="700" fill="#1C2733" text-anchor="middle">per check?</text>
<rect x="875.0" y="64.0" width="200" height="56" rx="12" fill="#fff" stroke="#D5DBE1" stroke-width="1.2"/>
<text x="975" y="88" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Tune rubric or prompt</text>
<text x="975" y="107" font-size="12" fill="#4E5B68" text-anchor="middle">rubric.md, judge prompt</text>
<rect x="875.0" y="393.0" width="200" height="74" rx="12" fill="#fff" stroke="#1F7A72" stroke-width="2"/>
<text x="975" y="426" font-size="15" font-weight="700" fill="#1C2733" text-anchor="middle">Fix real gaps</text>
<text x="975" y="445" font-size="12" fill="#4E5B68" text-anchor="middle">Rewrite messages that</text>
<text x="975" y="460" font-size="12" fill="#4E5B68" text-anchor="middle">still fail, then re-score</text>
<path d="M195 230 L235 230" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M405 230 L430 230 L430 140 L455 140" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M405 230 L430 230 L430 320 L455 320" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M635 140 L660 140 L660 215 L685 215" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M635 320 L660 320 L660 245 L685 245" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="662" y="300" font-size="12" fill="#4E5B68" text-anchor="start">baseline</text>
<path d="M770 393 L770 267" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M855 230 L887 230" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M975 172 L975 120" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<text x="985" y="150" font-size="12" fill="#4E5B68" text-anchor="start">No</text>
<path d="M875 92 L545 92 L545 103" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M975 288 L975 393" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<text x="985" y="345" font-size="12" fill="#4E5B68" text-anchor="start">Yes: trust the judge</text>
<path d="M975 467 L975 505 L110 505 L110 267" fill="none" stroke="#4E5B68" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="497" font-size="12" fill="#4E5B68" text-anchor="middle">Re-score the new versions</text>
<text x="32" y="540" font-size="12" fill="#7A8691">The keyword checker is a diagnostic baseline. Only the calibrated judge, checked against human scores, decides whether a rewrite passes.</text>
</svg>
