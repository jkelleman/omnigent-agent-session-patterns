<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#71717a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
<text x="32" y="40" font-size="20" font-weight="700" fill="#27272a">How a session moves between states</text>
